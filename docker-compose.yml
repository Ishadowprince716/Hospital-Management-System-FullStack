version: "3.9"

services:
  backend:
    build: ./hospital-management-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./hospital-management-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # optional, can be removed if not used

volumes:
  pgdata:
