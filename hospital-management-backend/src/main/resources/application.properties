# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Disable OAuth2 auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.oauth2-resource-server

# DATABASE: H2 (in-memory) for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,USERS;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 database console for local development
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# SQL Initialization
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MongoDB (optional)
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-32-bytes-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Rate limiting
rate-limit.auth.requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:30}
rate-limit.api.requests-per-minute=${RATE_LIMIT_API_REQUESTS_PER_MINUTE:300}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@localhost.dev
spring.mail.password=dummypassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.railway.app}

# AI (Gemini)
ai.gemini.api-key=${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
ai.gemini.api-endpoint=${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.api-endpoint=${OPENAI_API_ENDPOINT:https://api.openai.com/v1/responses}
ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# AWS S3 (placeholder)
# Provided via environment variables:
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# AWS_REGION
# AWS_S3_BUCKET_NAME

# Telehealth TURN relay (recommended for cross-network/mobile calls)
telehealth.turn.url=${TELEHEALTH_TURN_URL:}
telehealth.turn.username=${TELEHEALTH_TURN_USERNAME:}
telehealth.turn.password=${TELEHEALTH_TURN_PASSWORD:}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.hospital=INFO
logging.pattern.level=%5p [req:%X{requestId:-n/a}]
spring.main.allow-bean-definition-overriding=true

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=5
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=3
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.externalService.baseConfig=default
resilience4j.circuitbreaker.instances.aiService.baseConfig=default
resilience4j.circuitbreaker.instances.smsService.baseConfig=default
resilience4j.circuitbreaker.instances.emailService.baseConfig=default

# Caching Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=doctors,dashboardStats,aiInsights
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=500

# Hibernate Search (Lucene)
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=${HMS_LUCENE_INDEX_DIR:${java.io.tmpdir}/hms-lucene-indexes}
spring.jpa.properties.hibernate.search.backend.lucene_version=9.8.0

# Actuator health/readiness for deployment checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
