# Server
server.port=8080
server.address=0.0.0.0

# Disable OAuth2 auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.oauth2-resource-server

# DATABASE: H2 (in-memory) for local dev
spring.datasource.url=jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,USERS;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MongoDB (optional)
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@localhost.dev
spring.mail.password=dummypassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS
cors.allowed-origins=*

# Firebase Auth
firebase.web-api-key=${FIREBASE_WEB_API_KEY:AIzaSyCXDE4V8JssJmUWb2QpDnj2JGBkfS7_Low}

# AI (Gemini)
ai.gemini.api-key=${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
ai.gemini.api-endpoint=${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}

# AWS S3 (placeholder)
AWS_ACCESS_KEY_ID=INSERT_YOUR_ACCESS_KEY
AWS_SECRET_ACCESS_KEY=INSERT_YOUR_SECRET_KEY
AWS_REGION=us-east-1
AWS_S3_BUCKET_NAME=INSERT_YOUR_BUCKET_NAME

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.hospital=INFO
spring.main.allow-bean-definition-overriding=true

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=5
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=3
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.externalService.baseConfig=default
resilience4j.circuitbreaker.instances.aiService.baseConfig=default
resilience4j.circuitbreaker.instances.smsService.baseConfig=default
resilience4j.circuitbreaker.instances.emailService.baseConfig=default

# Caching Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=doctors,dashboardStats,aiInsights
spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=500

# Hibernate Search (Lucene)
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=${HMS_LUCENE_INDEX_DIR:${java.io.tmpdir}/hms-lucene-indexes}
spring.jpa.properties.hibernate.search.backend.lucene_version=9.8.0
