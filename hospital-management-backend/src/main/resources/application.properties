# Server
server.port=8080
server.address=0.0.0.0

# Disable OAuth2 auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.oauth2-resource-server

# DATABASE: MySQL 8.0 (PERSISTENT)
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MongoDB (optional)
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@localhost.dev
spring.mail.password=dummypassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS
cors.allowed-origins=*

# Firebase Auth
firebase.web-api-key=${FIREBASE_WEB_API_KEY:AIzaSyCXDE4V8JssJmUWb2QpDnj2JGBkfS7_Low}

# AI (Gemini)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.api-endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# AWS S3 (placeholder)
AWS_ACCESS_KEY_ID=INSERT_YOUR_ACCESS_KEY
AWS_SECRET_ACCESS_KEY=INSERT_YOUR_SECRET_KEY
AWS_REGION=us-east-1
AWS_S3_BUCKET_NAME=INSERT_YOUR_BUCKET_NAME

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.hospital=INFO
spring.main.allow-bean-definition-overriding=true
