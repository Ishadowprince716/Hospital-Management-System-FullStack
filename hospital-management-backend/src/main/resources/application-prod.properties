spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Keep production origins explicit (comma-separated list in Railway env).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hms-app-production-2a16.up.railway.app}

logging.level.org.hibernate.SQL=WARN
logging.level.com.hospital=INFO

# SMTP can be blocked or slow in container networks; do not make deploy health depend on it.
management.health.mail.enabled=false
