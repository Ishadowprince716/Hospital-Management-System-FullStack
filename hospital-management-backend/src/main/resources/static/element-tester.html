<!DOCTYPE html>
<html>

<head>
    <title>🧪 Comprehensive Element Testing Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2dd4bf 0%, #a78bfa 50%, #fb923c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            background: linear-gradient(135deg, #2dd4bf, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 38px;
            margin-bottom: 30px;
        }

        .test-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2dd4bf;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #14b8a6;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #a78bfa;
        }

        .btn-secondary:hover {
            background: #8b5cf6;
        }

        .test-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .result-panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .result-panel h3 {
            color: #2dd4bf;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #cbd5e1;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-item.pass {
            border-left-color: #10b981;
            background: #d1fae5;
        }

        .test-item.fail {
            border-left-color: #ef4444;
            background: #fee2e2;
        }

        .test-item.skip {
            border-left-color: #fbbf24;
            background: #fef3c7;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.pass {
            background: #10b981;
            color: white;
        }

        .status-badge.fail {
            background: #ef4444;
            color: white;
        }

        .status-badge.skip {
            background: #fbbf24;
            color: white;
        }

        .summary {
            background: linear-gradient(135deg, #2dd4bf, #a78bfa);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
        }

        .summary.show {
            display: block;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2dd4bf, #a78bfa);
            width: 0%;
            transition: width 0.5s ease;
        }

        .log {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-line {
            margin: 3px 0;
        }

        .log-line.success {
            color: #4ade80;
        }

        .log-line.error {
            color: #f87171;
        }

        .log-line.warning {
            color: #fbbf24;
        }

        .log-line.info {
            color: #60a5fa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Comprehensive Element Testing Tool</h1>
        <p style="color: #64748b; margin-bottom: 25px;">Systematically test every interactive element in the Hospital
            Management System</p>

        <div class="test-controls">
            <button class="btn" onclick="testLoginPage()">🔐 Test Login Page</button>
            <button class="btn" onclick="testRegistrationPage()">📝 Test Registration</button>
            <button class="btn btn-secondary" onclick="testAllAPIs()">🌐 Test All APIs</button>
            <button class="btn btn-secondary" onclick="testCompleteFlow()">🚀 Test Complete Flow</button>
            <button class="btn btn-secondary" onclick="clearResults()">🗑️ Clear Results</button>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="summary" id="summary">
            <h2>Test Summary</h2>
            <div class="summary-stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalTests">0</div>
                    <div>Total Tests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="passedTests">0</div>
                    <div>Passed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="failedTests">0</div>
                    <div>Failed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="successRate">0%</div>
                    <div>Success Rate</div>
                </div>
            </div>
        </div>

        <div class="test-results">
            <div class="result-panel">
                <h3>📄 Frontend Tests</h3>
                <div id="frontendResults"></div>
            </div>
            <div class="result-panel">
                <h3>🌐 API Tests</h3>
                <div id="apiResults"></div>
            </div>
        </div>

        <div class="log" id="testLog"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            skipped: 0
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function addResult(category, testName, passed, details = '') {
            const container = category === 'frontend' ? 'frontendResults' : 'apiResults';
            const div = document.getElementById(container);
            const item = document.createElement('div');
            item.className = `test-item ${passed ? 'pass' : 'fail'}`;
            item.innerHTML = `
                <span>${testName}</span>
                <span class="status-badge ${passed ? 'pass' : 'fail'}">${passed ? '✅ PASS' : '❌ FAIL'}</span>
            `;
            if (details) item.title = details;
            div.appendChild(item);

            testResults.total++;
            if (passed) testResults.passed++;
            else testResults.failed++;

            updateSummary();
        }

        function updateSummary() {
            document.getElementById('totalTests').textContent = testResults.total;
            document.getElementById('passedTests').textContent = testResults.passed;
            document.getElementById('failedTests').textContent = testResults.failed;
            const rate = testResults.total > 0 ? Math.round((testResults.passed / testResults.total) * 100) : 0;
            document.getElementById('successRate').textContent = rate + '%';
            document.getElementById('summary').classList.add('show');
        }

        function updateProgress(percent) {
            document.getElementById('progress').style.width = percent + '%';
        }

        function clearResults() {
            document.getElementById('frontendResults').innerHTML = '';
            document.getElementById('apiResults').innerHTML = '';
            document.getElementById('testLog').innerHTML = '';
            testResults = { total: 0, passed: 0, failed: 0, skipped: 0 };
            updateSummary();
            updateProgress(0);
        }

        async function testLoginPage() {
            log('🔐 Starting Login Page Tests...', 'info');
            clearResults();

            // Test page accessibility
            try {
                const response = await fetch('http://localhost:3000/index.html');
                addResult('frontend', 'Login page loads', response.ok);
                log(response.ok ? '✅ Login page accessible' : '❌ Login page not accessible', response.ok ? 'success' : 'error');
            } catch (e) {
                addResult('frontend', 'Login page loads', false, e.message);
                log('❌ Error: ' + e.message, 'error');
            }

            // Test if we can load the page content
            try {
                const response = await fetch('http://localhost:3000/index.html');
                const html = await response.text();

                addResult('frontend', 'Username input exists', html.includes('id="username"'));
                addResult('frontend', 'Password input exists', html.includes('id="password"'));
                addResult('frontend', 'Login button exists', html.includes('loginBtn') || html.includes('Login'));
                addResult('frontend', 'Role selectors exist', html.includes('role'));
                addResult('frontend', 'Register link exists', html.includes('register.html'));

                log('✅ All login page elements verified', 'success');
            } catch (e) {
                log('❌ Failed to verify page elements: ' + e.message, 'error');
            }

            updateProgress(100);
            log('✅ Login page testing complete', 'success');
        }

        async function testRegistrationPage() {
            log('📝 Starting Registration Page Tests...', 'info');
            clearResults();

            try {
                const response = await fetch('http://localhost:3000/register.html');
                addResult('frontend', 'Register page loads', response.ok);

                const html = await response.text();
                addResult('frontend', 'Full name field exists', html.includes('fullName') || html.includes('Full Name'));
                addResult('frontend', 'Email field exists', html.includes('email'));
                addResult('frontend', 'Phone field exists', html.includes('phone'));
                addResult('frontend', 'Password field exists', html.includes('password'));
                addResult('frontend', 'Role toggle exists', html.includes('role'));
                addResult('frontend', 'Register button exists', html.includes('register'));

                log('✅ Registration page elements verified', 'success');
            } catch (e) {
                log('❌ Error: ' + e.message, 'error');
            }

            updateProgress(100);
            log('✅ Registration page testing complete', 'success');
        }

        async function test AllAPIs() {
            log('🌐 Starting API Tests...', 'info');
            clearResults();
            let progress = 0;

            // Test Doctors API
            try {
                log('Testing GET /api/doctors/list...', 'info');
                const response = await fetch(`${API_BASE}/doctors/list`);
                const data = await response.json();
                addResult('api', 'GET /api/doctors/list', response.ok && Array.isArray(data));
                log(`✅ Doctors API: ${data.length} doctor(s) found`, 'success');
                progress += 20;
                updateProgress(progress);
            } catch (e) {
                addResult('api', 'GET /api/doctors/list', false, e.message);
                log('❌ Doctors API failed: ' + e.message, 'error');
            }

            // Test Login API
            try {
                log('Testing POST /api/auth/login...', 'info');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'patient1', password: 'patient123' })
                });
                const data = await response.json();
                const success = response.ok && data.token;
                addResult('api', 'POST /api/auth/login', success);
                log(success ? '✅ Login API working' : '❌ Login API failed', success ? 'success' : 'error');

                if (success) {
                    window.testAuthToken = data.token;
                    window.testUserId = data.userId || 3;

                    // Test protected endpoints
                    progress += 20;
                    updateProgress(progress);

                    // Test Appointments API
                    try {
                        log('Testing GET /api/appointments/patient/' + window.testUserId, 'info');
                        const aptResponse = await fetch(`${API_BASE}/appointments/patient/${window.testUserId}`, {
                            headers: { 'Authorization': `Bearer ${window.testAuthToken}` }
                        });
                        addResult('api', 'GET /api/appointments (auth)', aptResponse.ok);
                        log(aptResponse.ok ? '✅ Appointments API working' : '❌ Appointments API failed', aptResponse.ok ? 'success' : 'error');
                    } catch (e) {
                        addResult('api', 'GET /api/appointments (auth)', false, e.message);
                        log('❌ Appointments API error: ' + e.message, 'error');
                    }

                    progress += 20;
                    updateProgress(progress);

                    // Test Medical Records API
                    try {
                        log('Testing GET /api/medical-records/patient/' + window.testUserId, 'info');
                        const mrResponse = await fetch(`${API_BASE}/medical-records/patient/${window.testUserId}`, {
                            headers: { 'Authorization': `Bearer ${window.testAuthToken}` }
                        });
                        addResult('api', 'GET /api/medical-records (auth)', mrResponse.ok);
                        log(mrResponse.ok ? '✅ Medical Records API working' : '❌ Medical Records API failed', mrResponse.ok ? 'success' : 'error');
                    } catch (e) {
                        addResult('api', 'GET /api/medical-records (auth)', false, e.message);
                        log('❌ Medical Records API error: ' + e.message, 'error');
                    }

                    progress += 20;
                    updateProgress(progress);

                    // Test Bills API
                    try {
                        log('Testing GET /api/bills/patient/' + window.testUserId, 'info');
                        const billResponse = await fetch(`${API_BASE}/bills/patient/${window.testUserId}`, {
                            headers: { 'Authorization': `Bearer ${window.testAuthToken}` }
                        });
                        addResult('api', 'GET /api/bills (auth)', billResponse.ok);
                        log(billResponse.ok ? '✅ Bills API working' : '❌ Bills API failed', billResponse.ok ? 'success' : 'error');
                    } catch (e) {
                        addResult('api', 'GET /api/bills (auth)', false, e.message);
                        log('❌ Bills API error: ' + e.message, 'error');
                    }
                }
            } catch (e) {
                addResult('api', 'POST /api/auth/login', false, e.message);
                log('❌ Login API error: ' + e.message, 'error');
            }

            updateProgress(100);
            log('✅ API testing complete', 'success');
        }

        async function testCompleteFlow() {
            log('🚀 Starting Complete Flow Test...', 'info');
            clearResults();

            // 1. Test frontend pages
            await testLoginPage();
            await new Promise(r => setTimeout(r, 500));

            // 2. Test APIs
            await testAllAPIs();
            await new Promise(r => setTimeout(r, 500));

            // 3. Test registration page
            await testRegistrationPage();

            log('✅ Complete flow testing finished!', 'success');
            log(`📊 Results: ${testResults.passed}/${testResults.total} tests passed`, 'info');
        }

        // Run initial test on page load
        window.addEventListener('load', () => {
            log('🧪 Element Testing Tool Ready', 'success');
            log('Click a test button to begin...', 'info');
        });
    </script>
</body>

</html>
