name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - Hospital-Appointment-Patient-Record-Management

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend (tests + coverage gate)
        working-directory: hospital-management-backend
        run: mvn -B verify

      - name: Backend artifact sanity check
        working-directory: hospital-management-backend
        run: |
          ls target/*.jar
          echo "Backend JAR generated successfully."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hospital-management-react/package-lock.json

      - name: Install dependencies
        working-directory: hospital-management-react
        run: npm ci

      - name: Lint frontend
        working-directory: hospital-management-react
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: hospital-management-react
        run: npm run test

      - name: Build frontend
        working-directory: hospital-management-react
        run: npm run build

      - name: Dependency audit (critical)
        working-directory: hospital-management-react
        run: npm audit --audit-level=critical

      - name: Frontend artifact sanity check
        working-directory: hospital-management-react
        run: |
          ls dist/index.html
          echo "Frontend bundle generated successfully."
