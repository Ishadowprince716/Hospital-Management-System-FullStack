name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - Hospital-Management-System-FullStack
      - codex/**

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        working-directory: hospital-management-backend
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hospital-management-react/package-lock.json

      - name: Install dependencies
        working-directory: hospital-management-react
        run: npm ci

      - name: Lint frontend
        working-directory: hospital-management-react
        run: npm run lint

      - name: Build frontend
        working-directory: hospital-management-react
        run: npm run build
